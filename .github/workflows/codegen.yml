name: codegen-drift

# Drift gate for the committed backend codegen artifacts
# (codegen/generated/{schema,flows,errors}.json + features/). The monolith is
# the all-modules codegen source (docs/flow-system.md §0.1); these artifacts are
# what the frontend TS client is generated from, so a stale commit silently
# drifts the frontend types from the API. `make codegen-check` regenerates
# into a temp dir and diffs against the committed files — red on any
# divergence (the byte-stable encoding makes a no-op regen a no-op diff).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Aggregate inputs (stapel-* libs, installed from PyPI via range pins like
  # `stapel-auth>=0.7,<0.8`) move on a library RELEASE, not on a local commit
  # to this repo — push/pull_request alone never fires for that. Every 6h
  # bounds that blind window to hours instead of the days it silently was
  # (found only after a contract test had been red since 0.14.2 blaming the
  # wrong side of the seam). Tighter would just burn Actions minutes between
  # releases; looser reopens the window this exists to close.
  #
  # TEMPORARY SCAFFOLDING (task #129): the real home for this check is the
  # fleet-wide seam gate (§69, not built yet) — once that lands, this cron
  # (and the push/pull_request triggers above) should be retired in favor of
  # it, not left to rot alongside it.
  schedule:
    - cron: "0 */6 * * *"

jobs:
  codegen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: svc-app/requirements.txt

      - name: Install the monolith (all stapel modules, from PyPI)
        run: pip install -r svc-app/requirements.txt

      - name: codegen drift gate
        # PYTHON=python overrides the Makefile's local-venv default so the gate
        # runs against the CI interpreter. generate.sh boots the monolith on
        # hermetic sqlite (config.settings.codegen) and emits the artifacts;
        # the recipe diffs them against the committed files.
        run: make codegen-check PYTHON=python

  pin-staleness:
    # Separate job, deliberately NOT depending on codegen-check's install step:
    # this asks PyPI directly whether our pins still cover the fleet's current
    # releases, which is a different question from "does regen match the
    # committed aggregate." That self-consistency check is blind to release
    # drift by construction — it was green for months while every pin here was
    # several minors behind (see codegen/check_pin_staleness.py's docstring for
    # the full story). No `pip install` needed for this one; it only reads
    # requirements.txt and queries pypi.org/pypi/<pkg>/json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pin staleness gate (pins vs. PyPI's current releases)
        run: python3 codegen/check_pin_staleness.py
